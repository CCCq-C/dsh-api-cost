# dsh-api-cost bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field); install with
#   dsh plugin --profile web add dsh-api-cost
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process and registers the `apiCost` session projection, while
# the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/dsh-api-cost/client.js) load in the
# web GUI.
- insert:
    - id: api-cost
      name: dsh-api-cost
